name: starloom
description: "Starloom - a stop-motion gothic music player for your own music files."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Audio engine (libmpv): playback, EQ/bass filters, lock screen + media keys.
  mpv_audio_kit: ^0.7.2
  # Pure-Dart tag reader (title/artist/album/duration) for the library scan.
  audio_metadata_reader: ^1.8.1
  path_provider: ^2.1.4
  path: ^1.9.0
  # Shrinks embedded cover art into small thumbnails during the scan.
  image: ^4.3.0
  # Folder picker on Windows. iOS uses the local starloom_folders plugin.
  file_selector: ^1.0.3
  starloom_folders:
    path: packages/starloom_folders

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plates/
    - assets/clay/
    - assets/fonts/OFL-MysteryQuest.txt
    - assets/fonts/OFL-IMFellEnglish.txt
  fonts:
    - family: MysteryQuest
      fonts:
        - asset: assets/fonts/MysteryQuest-Regular.ttf
    - family: IMFell
      fonts:
        - asset: assets/fonts/IMFellEnglish-Regular.ttf
