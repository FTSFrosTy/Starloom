name: Build Starloom

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iPhone (.ipa, unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Generate iOS project
        run: |
          flutter create --platforms=ios --org com.ftsfrosty --project-name starloom .
          rm -f test/widget_test.dart
          bash tool/ios/patch_ios.sh

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build
        run: flutter build ios --release --no-codesign

      - name: Build Apple Watch app
        run: bash tool/watch/build_watch.sh

      - name: Package .ipa
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry Starloom.ipa Payload
          ls -lh Starloom.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Starloom-iPhone
          path: build/ios/iphoneos/Starloom.ipa
          retention-days: 14

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.ftsfrosty --project-name starloom .
          Remove-Item -ErrorAction SilentlyContinue test/widget_test.dart
          Copy-Item tool/icon/app_icon.ico windows/runner/resources/app_icon.ico -Force
          (Get-Content windows/runner/main.cpp) -replace 'L"starloom"', 'L"Starloom"' | Set-Content windows/runner/main.cpp

      - name: Get packages
        run: flutter pub get

      - name: Build
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          Rename-Item "$out/starloom.exe" "Starloom.exe" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath Starloom-Windows-portable.zip
          Get-Item Starloom-Windows-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=0.5.${{ github.run_number }}" tool/windows/starloom.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist/Starloom-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Starloom-Windows
          path: |
            dist/Starloom-Setup.exe
            Starloom-Windows-portable.zip
          retention-days: 14

  # Puts the files on the Releases page as plain downloads (no zip-in-a-zip):
  # https://github.com/FTSFrosTy/Starloom/releases/latest
  release:
    name: Publish downloads
    needs: [ios, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find out -type f -exec mv -n {} out/ \;
          ls -lh out
          gh release delete latest --yes --cleanup-tag || true
          cat > notes.md <<'NOTES'
          **iPhone:** download `Starloom.ipa`, drag it into Sideloadly, hit Start.

          **PC:** download `Starloom-Setup.exe` and run it. It installs over the old version and keeps your library. (`Starloom-Windows-portable.zip` is the no-install version.)
          NOTES
          echo "" >> notes.md
          echo "Build ${{ github.run_number }} · ${GITHUB_SHA::7}" >> notes.md
          gh release create latest out/Starloom.ipa out/Starloom-Setup.exe out/Starloom-Windows-portable.zip \
            --title "Starloom (newest build)" --notes-file notes.md --target "$GITHUB_SHA" --latest
