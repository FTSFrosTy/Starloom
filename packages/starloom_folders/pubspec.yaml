name: starloom_folders
description: "iOS folder picker that remembers the folder across launches (bookmark)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: StarloomFoldersPlugin
